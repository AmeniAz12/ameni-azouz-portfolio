<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">IP/MPLS backbone network cover</title>
  <desc id="desc">Professional network engineering cover showing an MPLS backbone, VPN sites, routing and security services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#06111d"/><stop offset=".55" stop-color="#0b1b2c"/><stop offset="1" stop-color="#10231f"/></linearGradient>
