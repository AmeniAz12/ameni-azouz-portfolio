<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Web scraping project preview</title>
  <desc id="desc">A dashboard-style preview for a Python web scraping project exporting product data to CSV.</desc>
  <rect width="1280" height="720" fill="#0b1120"/>
  <rect x="70" y="64" width="1140" height="592" rx="18" fill="#111827" stroke="#2f4058" stroke-width="2"/>
  <rect x="70" y="64" width="1140" height="62" rx="18" fill="#172033"/>
  <text x="108" y="104" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="24" font-weight="700">Python Web Scraping · Product Data Export</text>
  <rect x="108" y="164" width="300" height="122" rx="12" fill="#0f172a" stroke="#334155"/>
  <rect x="450" y="164" width="300" height="122" rx="12" fill="#0f172a" stroke="#334155"/>
  <rect x="792" y="164" width="300" height="122" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="132" y="205" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">Scripts</text>
  <text x="132" y="252" fill="#38bdf8" font-family="Arial, sans-serif" font-size="42" font-weight="800">2</text>
  <text x="474" y="205" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">Output</text>
  <text x="474" y="252" fill="#f8fafc" font-family="Arial, sans-serif" font-size="42" font-weight="800">CSV</text>
  <text x="816" y="205" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">Stack</text>
  <text x="816" y="252" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="42" font-weight="800">Selenium</text>
  <rect x="108" y="330" width="498" height="270" rx="12" fill="#0f172a" stroke="#334155"/>
  <rect x="650" y="330" width="442" height="270" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="138" y="375" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="20" font-weight="700">Extracted fields</text>
  <text x="680" y="375" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="20" font-weight="700">Pipeline</text>
  <g fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">
    <text x="138" y="425">Name</text>
    <text x="138" y="468">Category</text>
    <text x="138" y="511">Price and old price</text>
    <text x="138" y="554">Rating and product link</text>
  </g>
  <g stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M700 448h95"/>
    <path d="M842 448h95"/>
    <path d="M984 448h58"/>
