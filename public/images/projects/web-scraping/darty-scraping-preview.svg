  <g fill="#1d4ed8">
    <circle cx="700" cy="448" r="36"/>
    <circle cx="842" cy="448" r="36"/>
    <circle cx="984" cy="448" r="36"/>
  </g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <text x="700" y="453">Browse</text>
    <text x="842" y="453">Parse</text>
    <text x="984" y="453">CSV</text>
